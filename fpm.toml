name = "sqpopt"
version = "0.1.0"
license = "MIT"
author = "Jacob Williams"
description = "Modern Fortran SQP OPTimizer"

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[install]
library = true   # (`fpm install` installs libsqpopt.a and the .mod files; used by the Python bindings' build)

[fortran]
source-form = "default"
implicit-typing = true   # (needed by the legacy test problems in test/schittkowski_problems.f90;
                         #  every other source declares `implicit none` itself)

[dependencies]
LSQR = { git="https://github.com/jacobwilliams/LSQR", tag="1.1.0" }
lusol = { git="https://github.com/jacobwilliams/lusol", tag="1.0.0" }
fmin = { git="https://github.com/jacobwilliams/fmin.git", tag="1.1.3" }
qdldl-fortran = { git = "https://github.com/jacobwilliams/qdldl-fortran", tag="0.2.0" }
daqp-fortran = { git = "https://github.com/jacobwilliams/daqp-fortran", tag="0.1.1" }

[dev-dependencies]
slsqp = { git="https://github.com/jacobwilliams/slsqp.git", tag="1.6.1"}
