name = "sqpopt"
version = "0.1.0"
license = "MIT"
author = "Jacob Williams"
description = "Modern Fortran SQP OPTimizer"

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
source-form = "default"

[dependencies]
LSQR = { git="https://github.com/jacobwilliams/LSQR", tag="1.1.0" }
LSMR = { git="https://github.com/jacobwilliams/LSMR", tag="1.0.0" }
lusol = { git="https://github.com/jacobwilliams/lusol", tag="1.0.0" }
fmin = { git="https://github.com/jacobwilliams/fmin.git", tag="1.1.1" }
"lbfgsb" = { git="https://github.com/jacobwilliams/lbfgsb" }

[dev-dependencies]
slsqp = { git="https://github.com/jacobwilliams/slsqp.git" }
NumDiff = { git="https://github.com/jacobwilliams/NumDiff.git" }
nlesolver-fortran = { git="https://github.com/jacobwilliams/nlesolver-fortran.git" }
psqp = { git="https://github.com/jacobwilliams/psqp" }
