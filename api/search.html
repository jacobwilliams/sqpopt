    <!-- sqpopt theme: set before the page is drawn; the guide's choice (the same
         localStorage key, on the same site), or else the system's -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('sqpopt-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>

    <!-- sqpopt theme: the button switches the theme, and remembers it for the guide too -->
    <script>
      document.querySelector('.theme-toggle').addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-bs-theme', next);
        try { localStorage.setItem('sqpopt-theme', next); } catch (e) {}
