[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "sqpopt"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
build-python = "python python/sqpopt/_build.py"   # build the Python bindings' extension (see python/README.md)
build-python-mumps = "python python/sqpopt/_build.py --mumps"   # the same, with MUMPS (the inertia_control option)
test-python = { cmd = "python -m unittest discover -s python/tests", env = { QT_QPA_PLATFORM = "offscreen" } }
# SQPOPT on the CUTEst problems, through PyCUTEst and the Python bindings: `pixi run cutest setup`, then
# `pixi run cutest run` and `pixi run cutest report` (see tools/cutest_benchmark.py)
cutest = "python tools/cutest_benchmark.py"
# the library with MUMPS (the HAS_MUMPS preprocessor directive: `options%inertia_control`, `direct_qp`, and
# `direct_least_squares`, see the README); other arguments are passed on to fpm, e.g. `pixi run test-mumps test_kkt`,
# `pixi run test-mumps --profile release`, or `pixi run run-mumps --example benchmark_large --profile release`
build-mumps = 'fpm build --flag "-DHAS_MUMPS -I$CONDA_PREFIX/include" --link-flag "-ldmumps_seq"'
test-mumps = 'fpm test --flag "-DHAS_MUMPS -I$CONDA_PREFIX/include" --link-flag "-ldmumps_seq"'
run-mumps = 'fpm run --flag "-DHAS_MUMPS -I$CONDA_PREFIX/include" --link-flag "-ldmumps_seq"'

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = ">=3.14.7,<3.15"
matplotlib = ">=3.11.2,<4"
lcov = ">=2.5,<3"
ford = ">=7.0.13,<8"
graphviz = ">=14.1.2,<15"
pdftotext = ">=4.0.0,<5"
qtpy = ">=2.4.3,<3"
pyside6 = ">=6.11.1,<7"
fortls = ">=3.2.2,<4"
meson = ">=1.12.1,<2"
ninja = ">=1.13.2,<2"
mumps-seq = ">=5.8.2,<6"
scipy = ">=1.18.1,<2"

[pypi-dependencies]
fortitude-lint = ">=0.9.2, <0.10"
pycutest = ">=1.8.2, <2"
