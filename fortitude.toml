# Fortitude (Fortran linter) configuration: https://fortitude.readthedocs.io
# Run with `pixi run fortitude check`; the VS Code extension (plasmafair.fortitude)
# uses this file too. (Review `--fix` changes before keeping them: its fixes indent
# with 2 spaces, and can break the preprocessed .F90 files.)

[check]
line-length = 132            # the Fortran free-form limit, used throughout
extend-exclude = [
    "test",   # only the library (src/) and example/ are linted
]
ignore = [
    "C003",   # implicit-external-procedures: would require Fortran 2018's `implicit none (type, external)`
    "S081",   # superfluous-semicolon
    "C181",
]

[check.per-file-ignores]
# (f2py wraps external procedures, which can't be in a module)
"python/sqpopt/fortran/sqpopt_python_f2py.f90" = ["C092"]
# (the interfaces of LAPACK's Fortran 77 routines, DSYTRF and DSYTRS, have assumed-size arrays)
"src/sqpopt_dense_ldl_module.F90" = ["C071"]

[check.line-too-long]
ignore-comments = true   # (long trailing `!!` comments are fine)

[check.strings]
quotes = "single"
